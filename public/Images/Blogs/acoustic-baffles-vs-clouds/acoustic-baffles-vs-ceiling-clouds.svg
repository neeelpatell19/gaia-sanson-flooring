<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 726" width="640" height="726" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Baffles or ceiling clouds?</title>
<desc id="d">Where acoustic baffles suit and where ceiling clouds suit.</desc>
<rect width="640" height="726" fill="#fbf8f2"/>
<text x="320" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#2f394a">Baffles or ceiling clouds?</text>
<rect x="24" y="64" width="290" height="52" rx="10" fill="#2f394a"/><text x="169" y="98" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">Baffles</text>
<rect x="326" y="64" width="290" height="52" rx="10" fill="#a38703"/><text x="471" y="98" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">Clouds</text>
<rect x="24" y="130" width="592" height="86" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<rect x="24" y="130" width="290" height="86" rx="12" fill="#2f394a" opacity="0.12"/>
<text x="169" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#2f394a">✓ High, open ceilings</text>
<rect x="24" y="226" width="592" height="86" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<rect x="24" y="226" width="290" height="86" rx="12" fill="#2f394a" opacity="0.12"/>
<text x="169" y="278" text-anchor="middle" font-size="22" font-weight="700" fill="#2f394a">✓ Fit between services</text>
<rect x="24" y="322" width="592" height="86" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<rect x="24" y="322" width="290" height="86" rx="12" fill="#2f394a" opacity="0.12"/>
<text x="169" y="374" text-anchor="middle" font-size="22" font-weight="700" fill="#2f394a">✓ Keep the volume visible</text>
<rect x="24" y="418" width="592" height="86" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<rect x="326" y="418" width="290" height="86" rx="12" fill="#a38703" opacity="0.12"/>
<text x="471" y="470" text-anchor="middle" font-size="22" font-weight="700" fill="#a38703">✓ Lower ceilings</text>
<rect x="24" y="514" width="592" height="86" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<rect x="326" y="514" width="290" height="86" rx="12" fill="#a38703" opacity="0.12"/>
<text x="471" y="566" text-anchor="middle" font-size="22" font-weight="700" fill="#a38703">✓ Over desks and tables</text>
<rect x="24" y="610" width="592" height="86" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<rect x="326" y="610" width="290" height="86" rx="12" fill="#a38703" opacity="0.12"/>
<text x="471" y="662" text-anchor="middle" font-size="22" font-weight="700" fill="#a38703">✓ Define a zone</text>
</svg>