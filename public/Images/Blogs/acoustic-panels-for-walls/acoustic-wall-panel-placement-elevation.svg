<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Where acoustic panels go on a wall</title>
<desc id="d">Wall elevation with a band of panels at seated and standing head height, in groups rather than one block, with a gap for a switch and a wall light. The facing wall is treated in staggered positions.</desc>
<rect width="640" height="560" fill="#fbf8f2"/>
<text x="320" y="36" text-anchor="middle" font-size="25" font-weight="700" fill="#2f394a">Panels in a band, in groups, staggered</text>
<text x="40" y="78" font-size="20" font-weight="700" fill="#2f394a">Wall A</text>
<rect x="40" y="88" width="560" height="190" fill="#ece7dc" stroke="#2f394a" stroke-width="2"/>
<rect x="40" y="150" width="560" height="78" fill="#a38703" fill-opacity="0.12"/>
<g fill="#5b8fb0" stroke="#2f394a" stroke-width="2">
<rect x="64" y="148" width="110" height="82"/><rect x="184" y="148" width="110" height="82"/>
<rect x="420" y="148" width="80" height="82"/><rect x="510" y="148" width="66" height="82"/>
</g>
<rect x="330" y="176" width="22" height="30" rx="3" fill="#fbf8f2" stroke="#2f394a" stroke-width="2"/>
<circle cx="380" cy="120" r="12" fill="#f6c343" stroke="#2f394a" stroke-width="2"/>
<text x="341" y="252" text-anchor="middle" font-size="18" fill="#2f394a">switch</text>
<text x="380" y="106" text-anchor="middle" font-size="18" fill="#2f394a">light</text>
<line x1="40" y1="278" x2="600" y2="278" stroke="#2f394a" stroke-width="3"/>
<text x="40" y="340" font-size="20" font-weight="700" fill="#2f394a">Wall B, facing wall A</text>
<rect x="40" y="350" width="560" height="140" fill="#ece7dc" stroke="#2f394a" stroke-width="2"/>
<rect x="40" y="380" width="560" height="78" fill="#a38703" fill-opacity="0.12"/>
<g fill="#5b8fb0" stroke="#2f394a" stroke-width="2">
<rect x="124" y="378" width="110" height="82"/><rect x="300" y="378" width="110" height="82"/><rect x="470" y="378" width="100" height="82"/>
</g>
<line x1="40" y1="490" x2="600" y2="490" stroke="#2f394a" stroke-width="3"/>
<g font-size="20" fill="#2f394a">
<rect x="40" y="512" width="26" height="22" fill="#5b8fb0" stroke="#2f394a"/><text x="76" y="530">Acoustic panels</text>
<rect x="280" y="512" width="26" height="22" fill="#a38703" fill-opacity="0.25" stroke="#a38703"/><text x="316" y="530">Head-height band</text>
</g>
</svg>
