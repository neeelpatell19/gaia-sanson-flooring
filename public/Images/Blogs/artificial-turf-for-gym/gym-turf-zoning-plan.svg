<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Where turf goes in a gym</title>
<desc id="d">Gym plan: a turf sled and sprint track along one long wall, a turf functional zone for agility and floor work, a free-weights and lifting area on rubber, a cardio area, and a turf stretching corner.</desc>
<rect width="640" height="600" fill="#fbf8f2"/>
<text x="320" y="36" text-anchor="middle" font-size="25" font-weight="700" fill="#2f394a">Turf where members move</text>
<rect x="30" y="60" width="580" height="410" fill="#fff" stroke="#2f394a" stroke-width="4"/>
<rect x="34" y="64" width="572" height="70" fill="#5f9e3c"/>
<g stroke="#fff" stroke-width="2"><line x1="140" y1="64" x2="140" y2="134"/><line x1="470" y1="64" x2="470" y2="134"/></g>
<rect x="44" y="150" width="262" height="180" rx="10" fill="#7fb35a"/>
<rect x="322" y="150" width="276" height="180" rx="10" fill="#3b3f46"/>
<rect x="44" y="346" width="262" height="114" rx="10" fill="#b9dc95"/>
<rect x="322" y="346" width="276" height="114" rx="10" fill="#e6e2da"/>
<g font-size="20" font-weight="700" text-anchor="middle">
<text x="320" y="92" fill="#fff">Sled and sprint track</text>
<text x="175" y="226" fill="#fff">Functional zone</text>
<text x="460" y="226" fill="#fff">Free weights</text>
<text x="175" y="396" fill="#2f394a">Stretching</text>
<text x="460" y="396" fill="#2f394a">Cardio</text>
</g>
<g font-size="18" text-anchor="middle">
<text x="320" y="124" fill="#fff">turf, 10 or 15 mm</text>
<text x="175" y="254" fill="#fff">agility, ropes,</text>
<text x="175" y="278" fill="#fff">floor work on turf</text>
<text x="460" y="254" fill="#fff">and lifting</text>
<text x="460" y="278" fill="#fff">on rubber flooring</text>
<text x="175" y="422" fill="#2f394a">and mobility on turf</text>
<text x="460" y="422" fill="#2f394a">machines</text>
</g>
<g font-size="18" fill="#2f394a">
<rect x="40" y="520" width="34" height="24" rx="4" fill="#5f9e3c"/><text x="84" y="538">Turf</text>
