<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Where to treat an auditorium</title>
<desc id="d">Long section: speaker on the stage at left, raked seating rising to the right. Reflective panels above the stage send sound down to the audience. Acoustic panels cover the rear wall; absorbers hang from the ceiling over the rear seats. The long echo path from the rear wall back to the stage is absorbed.</desc>
<defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#a0603d"/></marker>
<marker id="n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3f5d7a"/></marker></defs>
<rect width="100%" height="100%" fill="#fbf8f2"/>
<text x="320" y="38" text-anchor="middle" font-size="27" font-weight="700" fill="#2f394a">Reflect at the front, absorb at the back</text>
<!-- shell -->
<polyline points="30,420 30,90 610,90 610,420" fill="none" stroke="#2f394a" stroke-width="4"/>
<!-- stage -->
<rect x="30" y="360" width="130" height="60" fill="#c8b79c" stroke="#2f394a" stroke-width="2"/>
<circle cx="90" cy="318" r="12" fill="#2f394a"/><rect x="82" y="330" width="16" height="30" fill="#2f394a"/>
<!-- rake -->
<polygon points="160,420 610,420 610,300 160,390" fill="#e2dccf" stroke="#2f394a" stroke-width="2"/>
<g fill="#a0603d">
<rect x="200" y="368" width="22" height="16"/><rect x="250" y="360" width="22" height="16"/><rect x="300" y="352" width="22" height="16"/><rect x="350" y="344" width="22" height="16"/><rect x="400" y="336" width="22" height="16"/><rect x="450" y="327" width="22" height="16"/><rect x="500" y="318" width="22" height="16"/><rect x="550" y="310" width="22" height="16"/>
</g>
<!-- reflectors over stage -->
<line x1="60" y1="150" x2="210" y2="120" stroke="#7a7f87" stroke-width="10" stroke-linecap="round"/>
<!-- rear wall absorber -->
<rect x="592" y="110" width="16" height="190" fill="#3f5d7a"/>
<!-- ceiling absorbers over rear -->
<g fill="#3f5d7a"><rect x="380" y="112" width="60" height="12"/><rect x="460" y="112" width="60" height="12"/><rect x="540" y="112" width="40" height="12"/></g>
<line x1="410" y1="90" x2="410" y2="112" stroke="#2f394a"/><line x1="490" y1="90" x2="490" y2="112" stroke="#2f394a"/><line x1="560" y1="90" x2="560" y2="112" stroke="#2f394a"/>
<!-- rays -->
<polyline points="100,300 140,138 400,330" fill="none" stroke="#3f5d7a" stroke-width="3" marker-end="url(#n)"/>
<polyline points="110,310 590,220 300,330" fill="none" stroke="#a0603d" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m)"/>
<text x="560" y="250" text-anchor="end" font-size="20" font-weight="700" fill="#a0603d">✕</text>
<!-- labels -->
<text x="40" y="78" font-size="20" font-weight="700" fill="#7a7f87">Reflector over stage</text>
<text x="600" y="78" text-anchor="end" font-size="20" font-weight="700" fill="#3f5d7a">Ceiling absorbers</text>
<text x="40" y="452" font-size="20" fill="#2f394a">Stage</text>
<text x="600" y="452" text-anchor="end" font-size="20" fill="#2f394a">Upholstered seats, carpet</text>
<rect x="40" y="474" width="22" height="22" fill="#3f5d7a"/><text x="70" y="492" font-size="20" fill="#2f394a">Absorption</text>
<line x1="210" y1="485" x2="260" y2="485" stroke="#3f5d7a" stroke-width="3"/><text x="268" y="492" font-size="20" fill="#2f394a">Useful</text>
<line x1="360" y1="485" x2="410" y2="485" stroke="#a0603d" stroke-width="3" stroke-dasharray="9 7"/><text x="418" y="492" font-size="20" fill="#2f394a">Echo, absorbed</text>
<text x="586" y="200" text-anchor="end" font-size="20" fill="#3f5d7a" font-weight="700">Rear</text><text x="586" y="222" text-anchor="end" font-size="20" fill="#3f5d7a" font-weight="700">wall</text>
</svg>
