<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 575" width="640" height="575" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Banquet hall flooring zones</title>
<desc id="d">Plan of a banquet hall. The stage and the dance floor in front of it, the buffet counter along one side and the service route to the kitchen have a hard floor. The seating area with round tables is carpeted in a pattern, and every guest and service entrance has matting.</desc>
<defs>
<pattern id="pc" width="28" height="28" patternUnits="userSpaceOnUse">
<rect width="28" height="28" fill="#8a3b3b"/>
<circle cx="14" cy="14" r="6" fill="none" stroke="#c9a25c" stroke-width="2"/>
<circle cx="0" cy="0" r="3" fill="#c9a25c"/><circle cx="28" cy="0" r="3" fill="#c9a25c"/><circle cx="0" cy="28" r="3" fill="#c9a25c"/><circle cx="28" cy="28" r="3" fill="#c9a25c"/>
</pattern>
</defs>
<rect width="100%" height="100%" fill="#fbf8f2"/>
<text x="320" y="40" text-anchor="middle" font-size="27" font-weight="700" fill="#2f394a">Where carpet goes in a banquet hall</text>
<rect x="40" y="70" width="560" height="400" fill="url(#pc)" stroke="#2f394a" stroke-width="4"/>
<rect x="160" y="72" width="320" height="64" fill="#d9d3c7"/>
<text x="320" y="112" text-anchor="middle" font-size="21" font-weight="700" fill="#2f394a">Stage / mandap</text>
<rect x="225" y="150" width="190" height="96" fill="#d9d3c7" stroke="#2f394a" stroke-width="2"/>
<text x="320" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#2f394a">Dance floor</text>
<rect x="42" y="150" width="70" height="250" fill="#d9d3c7"/>
<text x="77" y="275" text-anchor="middle" font-size="21" font-weight="700" fill="#2f394a" transform="rotate(-90 77 275)">Buffet counters</text>
<rect x="528" y="72" width="70" height="230" fill="#d9d3c7"/>
<rect x="528" y="72" width="70" height="20" fill="#e3b04b"/>
<text x="563" y="195" text-anchor="middle" font-size="21" font-weight="700" fill="#2f394a" transform="rotate(90 563 187)">Service route</text>
<g fill="#fbf8f2" stroke="#2f394a" stroke-width="2">
<circle cx="170" cy="300" r="26"/><circle cx="270" cy="300" r="26"/><circle cx="370" cy="300" r="26"/><circle cx="465" cy="300" r="26"/>
<circle cx="170" cy="395" r="26"/><circle cx="270" cy="395" r="26"/><circle cx="370" cy="395" r="26"/><circle cx="465" cy="395" r="26"/>
</g>
<rect x="250" y="448" width="140" height="20" fill="#e3b04b"/>
<text x="320" y="500" text-anchor="middle" font-size="21" font-weight="700" fill="#2f394a">Guest entrance</text>
<rect x="40" y="528" width="24" height="24" fill="url(#pc)" stroke="#2f394a"/><text x="72" y="547" font-size="20" fill="#2f394a">Patterned carpet</text>
<rect x="250" y="528" width="24" height="24" fill="#d9d3c7" stroke="#2f394a"/><text x="282" y="547" font-size="20" fill="#2f394a">Hard floor</text>
<rect x="420" y="528" width="24" height="24" fill="#e3b04b" stroke="#2f394a"/><text x="452" y="547" font-size="20" fill="#2f394a">Matting</text>
</svg>
