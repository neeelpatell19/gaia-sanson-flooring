<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Office flooring zone map</title>
<desc id="d">Office floor plan divided into zones. Workstations, meeting rooms, cabins, corridors and the breakout area are carpet tiles. The boardroom and reception are broadloom. The entrance, pantry and washroom lobby are hard floor, with matting inside the entrance.</desc>
<rect width="100%" height="100%" fill="#fbf8f2"/>
<text x="320" y="38" text-anchor="middle" font-size="27" font-weight="700" fill="#2f394a">Office flooring by zone</text>
<g stroke="#2f394a" stroke-width="2.5">
<rect x="20" y="60" width="380" height="200" fill="#9fb8a9"/>
<rect x="400" y="60" width="220" height="110" fill="#c79a74"/>
<rect x="400" y="170" width="110" height="90" fill="#9fb8a9"/>
<rect x="510" y="170" width="110" height="90" fill="#9fb8a9"/>
<rect x="20" y="260" width="600" height="56" fill="#9fb8a9"/>
<rect x="20" y="316" width="200" height="130" fill="#9fb8a9"/>
