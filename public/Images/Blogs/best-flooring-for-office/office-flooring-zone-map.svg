<rect x="360" y="316" width="130" height="130" fill="#d7d3cb"/>
<rect x="490" y="316" width="130" height="130" fill="#c79a74"/>
<rect x="490" y="446" width="130" height="50" fill="#d7d3cb"/>
</g>
<rect x="508" y="452" width="96" height="16" fill="#5a5f66"/>
<g font-size="21" font-weight="700" fill="#2f394a" text-anchor="middle">
<text x="210" y="166">Workstations</text>
<text x="510" y="122">Boardroom</text>
<text x="455" y="210">Meeting</text><text x="565" y="210">Cabin</text>
