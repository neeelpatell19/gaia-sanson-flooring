<text x="120" y="388">Breakout</text>
<text x="290" y="388">Pantry</text>
<text x="425" y="378">Washroom</text><text x="425" y="402">lobby</text>
<text x="555" y="388">Reception</text>
<text x="555" y="490" font-size="20">Entrance</text>
</g>
