<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">School flooring by space</title>
<desc id="d">Three groups. Hard, slip-resistant floors: corridors, canteens, laboratories, toilets and art rooms. Carpet tiles: libraries, reading corners, early-years rooms and staff rooms. Turf and MultiTurf: play areas, courts and green spaces.</desc>
<rect width="640" height="600" fill="#fbf8f2"/>
<text x="320" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#2f394a">Match the floor to the space</text>
<g font-size="20">
<rect x="24" y="64" width="592" height="160" rx="12" fill="#e3eef7" stroke="#2a7fc1" stroke-width="2"/>
<text x="44" y="100" font-size="22" font-weight="700" fill="#1f5f8f">Hard, slip-resistant floor</text>
<text x="44" y="134" fill="#2f394a">Corridors, canteens, laboratories,</text>
<text x="44" y="162" fill="#2f394a">toilets, art rooms</text>
<text x="44" y="198" fill="#2f394a">Why: wet, messy or heavy traffic</text>
<rect x="24" y="238" width="592" height="160" rx="12" fill="#f4ecd9" stroke="#a38703" stroke-width="2"/>
<text x="44" y="274" font-size="22" font-weight="700" fill="#7d6702">Carpet tiles</text>
<text x="44" y="308" fill="#2f394a">Libraries, reading corners,</text>
<text x="44" y="336" fill="#2f394a">early-years rooms, staff rooms</text>
<text x="44" y="372" fill="#2f394a">Why: quiet, comfortable, easy to repair</text>
<rect x="24" y="412" width="592" height="160" rx="12" fill="#e5f0db" stroke="#5b8f2e" stroke-width="2"/>
<text x="44" y="448" font-size="22" font-weight="700" fill="#3f6b1d">Turf and MultiTurf</text>
<text x="44" y="482" fill="#2f394a">Play areas, courts,</text>
<text x="44" y="510" fill="#2f394a">gardens and green spaces</text>
<text x="44" y="546" fill="#2f394a">Why: green and usable all year</text>
</g>
<g font-size="18" font-weight="700" fill="#fff">
<rect x="470" y="84" width="128" height="34" rx="17" fill="#2a7fc1"/><text x="534" y="107" text-anchor="middle">Busy</text>
<rect x="470" y="258" width="128" height="34" rx="17" fill="#a38703"/><text x="534" y="281" text-anchor="middle">Quiet</text>
<rect x="470" y="432" width="128" height="34" rx="17" fill="#5b8f2e"/><text x="534" y="455" text-anchor="middle">Outdoors</text>
</g>
</svg>
