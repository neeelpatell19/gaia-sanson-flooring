<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 880" width="640" height="880" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Reading a GAIA Gridwork specification</title>
<desc id="d">Annotated specification for GAIA Gridwork carpet tiles: 50 by 50 cm tile, olefin yarn, 1/12 gauge, 18 oz pile weight of about 610 g per square metre, 5 mm tile height, bitumen backing, 20 tiles per box covering 5 square metres, and a GreenPro certificate.</desc>
<rect width="640" height="880" fill="#fbf8f2"/>
<text x="320" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#2f394a">Reading a GAIA Gridwork specification</text>
<rect x="24" y="66" width="592" height="88" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<circle cx="72" cy="110.0" r="25" fill="#a38703"/><text x="72" y="119.0" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text>
<text x="114" y="104.0" font-size="23" font-weight="700" fill="#2f394a">Format: 50 × 50 cm tile</text>
<text x="114" y="134.0" font-size="20" fill="#4a5568">square; GAIA planks are 25 × 100 cm</text>
<rect x="24" y="166" width="592" height="88" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<circle cx="72" cy="210.0" r="25" fill="#a38703"/><text x="72" y="219.0" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">2</text>
<text x="114" y="204.0" font-size="23" font-weight="700" fill="#2f394a">Yarn: olefin</text>
<text x="114" y="234.0" font-size="20" fill="#4a5568">polypropylene; nylon is more resilient</text>
<rect x="24" y="266" width="592" height="88" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<circle cx="72" cy="310.0" r="25" fill="#a38703"/><text x="72" y="319.0" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">3</text>
<text x="114" y="304.0" font-size="23" font-weight="700" fill="#2f394a">Gauge: 1/12</text>
<text x="114" y="334.0" font-size="20" fill="#4a5568">tuft rows about 2.1 mm apart</text>
<rect x="24" y="366" width="592" height="88" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<circle cx="72" cy="410.0" r="25" fill="#a38703"/><text x="72" y="419.0" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">4</text>
<text x="114" y="404.0" font-size="23" font-weight="700" fill="#2f394a">Pile weight: 18 oz</text>
<text x="114" y="434.0" font-size="20" fill="#4a5568">about 610 g of yarn per square metre</text>
<rect x="24" y="466" width="592" height="88" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<circle cx="72" cy="510.0" r="25" fill="#a38703"/><text x="72" y="519.0" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">5</text>
<text x="114" y="504.0" font-size="23" font-weight="700" fill="#2f394a">Tile height: 5 mm</text>
<text x="114" y="534.0" font-size="20" fill="#4a5568">total thickness of pile and backing</text>
<rect x="24" y="566" width="592" height="88" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<circle cx="72" cy="610.0" r="25" fill="#a38703"/><text x="72" y="619.0" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">6</text>
<text x="114" y="604.0" font-size="23" font-weight="700" fill="#2f394a">Backing: bitumen</text>
<text x="114" y="634.0" font-size="20" fill="#4a5568">weight that keeps the tile flat</text>
<rect x="24" y="666" width="592" height="88" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<circle cx="72" cy="710.0" r="25" fill="#a38703"/><text x="72" y="719.0" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">7</text>
<text x="114" y="704.0" font-size="23" font-weight="700" fill="#2f394a">Packing: 20 per box</text>
<text x="114" y="734.0" font-size="20" fill="#4a5568">each box covers 5 m²</text>
<rect x="24" y="766" width="592" height="88" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<circle cx="72" cy="810.0" r="25" fill="#a38703"/><text x="72" y="819.0" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">8</text>
<text x="114" y="804.0" font-size="23" font-weight="700" fill="#2f394a">Certificate: GreenPro</text>
<text x="114" y="834.0" font-size="20" fill="#4a5568">check it names the product type</text>
</svg>