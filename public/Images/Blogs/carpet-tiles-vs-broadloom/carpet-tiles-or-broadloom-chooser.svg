<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 630" width="640" height="630" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#fbf8f2"/>
<text x="320" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#2f394a">Carpet tiles or broadloom?</text>
<rect x="24" y="80" width="380" height="104" rx="12" fill="#ffffff" stroke="#2f394a" stroke-width="2"/>
<text x="40" y="108" font-size="18" fill="#7a7f87">Question 1</text>
<text x="40" y="138" font-size="22" fill="#2f394a">Will the layout change</text>
<text x="40" y="166" font-size="22" fill="#2f394a">within a few years?</text>
<line x1="404" y1="132" x2="440" y2="132" stroke="#4f7a6a" stroke-width="4"/><polygon points="440,124 452,132 440,140" fill="#4f7a6a"/>
<text x="428" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#4f7a6a">Yes</text>
<rect x="456" y="104" width="164" height="56" rx="28" fill="#4f7a6a"/><text x="538" y="140" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Carpet tiles</text>
<text x="214" y="204" text-anchor="middle" font-size="18" fill="#7a7f87">No ↓</text>
<rect x="24" y="208" width="380" height="104" rx="12" fill="#ffffff" stroke="#2f394a" stroke-width="2"/>
<text x="40" y="236" font-size="18" fill="#7a7f87">Question 2</text>
<text x="40" y="266" font-size="22" fill="#2f394a">Do you need access under</text>
<text x="40" y="294" font-size="22" fill="#2f394a">the floor?</text>
<line x1="404" y1="260" x2="440" y2="260" stroke="#4f7a6a" stroke-width="4"/><polygon points="440,252 452,260 440,268" fill="#4f7a6a"/>
<text x="428" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#4f7a6a">Yes</text>
<rect x="456" y="232" width="164" height="56" rx="28" fill="#4f7a6a"/><text x="538" y="268" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Carpet tiles</text>
<text x="214" y="332" text-anchor="middle" font-size="18" fill="#7a7f87">No ↓</text>
<rect x="24" y="336" width="380" height="104" rx="12" fill="#ffffff" stroke="#2f394a" stroke-width="2"/>
<text x="40" y="364" font-size="18" fill="#7a7f87">Question 3</text>
<text x="40" y="394" font-size="22" fill="#2f394a">Is one continuous custom</text>
<text x="40" y="422" font-size="22" fill="#2f394a">pattern essential?</text>
<line x1="404" y1="388" x2="440" y2="388" stroke="#a0603d" stroke-width="4"/><polygon points="440,380 452,388 440,396" fill="#a0603d"/>
<text x="428" y="378" text-anchor="middle" font-size="18" font-weight="700" fill="#a0603d">Yes</text>
<rect x="456" y="360" width="164" height="56" rx="28" fill="#a0603d"/><text x="538" y="396" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Broadloom</text>
<text x="214" y="460" text-anchor="middle" font-size="18" fill="#7a7f87">No ↓</text>
<rect x="24" y="464" width="380" height="104" rx="12" fill="#ffffff" stroke="#2f394a" stroke-width="2"/>
<text x="40" y="492" font-size="18" fill="#7a7f87">Question 4</text>
<text x="40" y="522" font-size="22" fill="#2f394a">Hotel corridor, guest</text>
<text x="40" y="550" font-size="22" fill="#2f394a">room, boardroom or ballroom?</text>
<line x1="404" y1="516" x2="440" y2="516" stroke="#a0603d" stroke-width="4"/><polygon points="440,508 452,516 440,524" fill="#a0603d"/>
<text x="428" y="506" text-anchor="middle" font-size="18" font-weight="700" fill="#a0603d">Yes</text>
<rect x="456" y="488" width="164" height="56" rx="28" fill="#a0603d"/><text x="538" y="524" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Broadloom</text>
<text x="320" y="608" text-anchor="middle" font-size="20" fill="#2f394a">All no? Either works: decide on design and budget.</text>
</svg>