.h{font:600 25px Ubuntu,Arial,sans-serif;fill:#2c3e50;text-anchor:middle;letter-spacing:1px}
.g{font:700 22px Ubuntu,Arial,sans-serif;fill:#7a6400;letter-spacing:2px}
.gs{font:400 20px Ubuntu,Arial,sans-serif;fill:#5d6d7e}
</style>
<clipPath id="cp"><rect width="240" height="240"/></clipPath>
