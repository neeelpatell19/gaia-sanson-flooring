<title id="t">Carpet plank and carpet tile layouts</title>
<desc id="d">Plank layouts for Miami, Signature, Alankrit and Drip: Ashlar, with staggered planks, and Herringbone. Tile layouts for Aangan, Shining Glow, Naqsh and Dalaan: Quarter-turn, with each tile rotated against its neighbours, and Brick, with rows offset by half a tile.</desc>
