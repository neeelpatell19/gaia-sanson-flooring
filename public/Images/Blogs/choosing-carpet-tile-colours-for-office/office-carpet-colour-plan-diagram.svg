<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">A three-layer carpet colour plan for an office</title>
<desc id="d">Office floor plan in three colours: a grey base across the desks, a blue block under the meeting area and an ochre block in the café, joined by a darker grey route from the entrance.</desc>
<rect width="100%" height="100%" fill="#fbf8f2"/>
<text x="320" y="40" text-anchor="middle" font-size="27" font-weight="700" fill="#2f394a">Office colour plan in three layers</text>
<rect x="30" y="64" width="580" height="300" fill="#b8b6b1" stroke="#2f394a" stroke-width="3"/>
<!-- route -->
<rect x="30" y="196" width="580" height="40" fill="#7d7b77"/>
<!-- meeting zone -->
<rect x="400" y="80" width="194" height="104" fill="#4c6f96"/>
<text x="497" y="138" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Meeting</text>
<!-- cafe accent -->
<rect x="400" y="248" width="194" height="100" fill="#d39a3a"/>
<text x="497" y="305" text-anchor="middle" font-size="22" font-weight="700" fill="#2f394a">Café</text>
<!-- desks -->
<g fill="#ffffff" stroke="#2f394a" stroke-width="1.5">
<rect x="56" y="92" width="90" height="34"/><rect x="56" y="140" width="90" height="34"/><rect x="190" y="92" width="90" height="34"/><rect x="190" y="140" width="90" height="34"/>
<rect x="56" y="262" width="90" height="34"/><rect x="56" y="308" width="90" height="34"/><rect x="190" y="262" width="90" height="34"/><rect x="190" y="308" width="90" height="34"/>
</g>
<text x="330" y="223" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Route</text>
<!-- entrance -->
<polygon points="30,206 8,216 30,226" fill="#a0603d"/>
<!-- legend -->
<rect x="30" y="392" width="30" height="30" fill="#b8b6b1" stroke="#2f394a"/><text x="70" y="415" font-size="21" fill="#2f394a">1 Base: desks and corridors</text>
<rect x="30" y="436" width="30" height="30" fill="#4c6f96"/><text x="70" y="459" font-size="21" fill="#2f394a">2 Zone colour: meeting areas</text>
<rect x="350" y="392" width="30" height="30" fill="#d39a3a"/><text x="390" y="415" font-size="21" fill="#2f394a">3 Accent: café</text>
<rect x="350" y="436" width="30" height="30" fill="#7d7b77"/><text x="390" y="459" font-size="21" fill="#2f394a">Darker route</text>
</svg>
