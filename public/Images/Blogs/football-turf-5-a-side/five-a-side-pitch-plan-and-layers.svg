<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">5-a-side pitch plan and turf build-up</title>
<desc id="d">Plan of a 5-a-side pitch 25 to 50 metres long and 16 to 35 metres wide with goals up to 5 metres wide, run-off and perimeter netting; and a section through football turf with infill, an optional shock pad, a compacted base and the ground, with a fall for drainage.</desc>
<rect width="640" height="600" fill="#fbf8f2"/>
<text x="320" y="36" text-anchor="middle" font-size="25" font-weight="700" fill="#2f394a">Size the pitch, then build the base</text>
