<rect x="90" y="80" width="420" height="186" fill="#5f9e3c"/>
<g stroke="#fff" stroke-width="3" fill="none">
<rect x="90" y="80" width="420" height="186"/>
<line x1="300" y1="80" x2="300" y2="266"/>
<circle cx="300" cy="173" r="30"/>
<path d="M90 128 A60 60 0 0 1 90 218"/><path d="M510 128 A60 60 0 0 0 510 218"/>
</g>
<rect x="80" y="153" width="10" height="40" fill="#fff" stroke="#2f394a"/>
<rect x="510" y="153" width="10" height="40" fill="#fff" stroke="#2f394a"/>
