<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 650" width="640" height="650" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hospital acoustic zones</title>
<desc id="d">Plan of a hospital floor around a central corridor. The corridor, waiting area and nurses' station get absorbent ceilings and wall panels. Patient rooms get an absorbent ceiling where infection control approves it. Consultation rooms need sealed doors and partitions carried up to the structure. Clinical areas follow the infection-control specification.</desc>
<rect width="100%" height="100%" fill="#fbf8f2"/>
<text x="320" y="40" text-anchor="middle" font-size="27" font-weight="700" fill="#2f394a">What each hospital zone needs</text>
<g stroke="#2f394a" stroke-width="3">
<rect x="40" y="70" width="140" height="150" fill="#cfe0d7"/>
<rect x="180" y="70" width="140" height="150" fill="#cfe0d7"/>
<rect x="320" y="70" width="140" height="150" fill="#cfe0d7"/>
<rect x="460" y="70" width="140" height="150" fill="#4f7a6a"/>
<rect x="40" y="220" width="560" height="90" fill="#4f7a6a"/>
<rect x="40" y="310" width="250" height="160" fill="#4f7a6a"/>
<rect x="290" y="310" width="155" height="160" fill="#f3e3c0"/>
<rect x="445" y="310" width="155" height="160" fill="#d9d3c7"/>
</g>
<g font-size="21" font-weight="700" text-anchor="middle" fill="#2f394a">
<text x="110" y="150">Patient</text><text x="110" y="176">room</text>
<text x="250" y="150">Patient</text><text x="250" y="176">room</text>
<text x="390" y="150">Patient</text><text x="390" y="176">room</text>
<text x="530" y="150" fill="#fff">Nurses'</text><text x="530" y="176" fill="#fff">station</text>
<text x="320" y="273" fill="#fff">Corridor</text>
<text x="165" y="397" fill="#fff">Waiting area</text>
<text x="367" y="384">Consult</text><text x="367" y="410">rooms</text>
<text x="522" y="384">Clinical</text><text x="522" y="410">areas</text>
</g>
<g font-size="20" fill="#2f394a">
<rect x="40" y="500" width="24" height="24" fill="#4f7a6a" stroke="#2f394a"/><text x="74" y="519">Absorb overhead and on the walls</text>
<rect x="40" y="536" width="24" height="24" fill="#cfe0d7" stroke="#2f394a"/><text x="74" y="555">Absorbent ceiling, if infection control approves</text>
<rect x="40" y="572" width="24" height="24" fill="#f3e3c0" stroke="#2f394a"/><text x="74" y="591">Privacy: sealed doors, full-height partitions</text>
<rect x="40" y="608" width="24" height="24" fill="#d9d3c7" stroke="#2f394a"/><text x="74" y="627">Clinical areas: infection-control specification</text>
</g>
</svg>
