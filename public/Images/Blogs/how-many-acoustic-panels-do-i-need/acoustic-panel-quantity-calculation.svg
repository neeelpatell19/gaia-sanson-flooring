<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Acoustic panel quantity, worked example</title>
<desc id="d">Meeting room 6 by 5 by 3 metres: volume 90 cubic metres; absorption needed for 0.6 seconds is about 24 square metres; existing hard surfaces about 6; add about 18; at NRC 0.85 on an air gap that is about 21 square metres, about seven 1220 by 2440 millimetre sheets.</desc>
<rect width="640" height="600" fill="#fbf8f2"/>
<text x="320" y="36" text-anchor="middle" font-size="25" font-weight="700" fill="#2f394a">Meeting room 6 × 5 × 3 m, hard finishes</text>
<g font-size="20" fill="#2f394a">
<g><circle cx="52" cy="96" r="22" fill="#2f394a"/><text x="52" y="103" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="90" y="90" font-weight="700">Volume</text><text x="90" y="116">6 × 5 × 3 = 90 m³</text></g>
<g><circle cx="52" cy="190" r="22" fill="#2f394a"/><text x="52" y="197" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="90" y="184" font-weight="700">Absorption needed for 0.6 s</text><text x="90" y="210">0.161 × 90 ÷ 0.6 ≈ 24 m²</text></g>
<g><circle cx="52" cy="284" r="22" fill="#2f394a"/><text x="52" y="291" text-anchor="middle" font-weight="700" fill="#fff">3</text><text x="90" y="278" font-weight="700">Already in the room</text><text x="90" y="304">126 m² of hard surfaces × 0.05 ≈ 6 m²</text></g>
<g><circle cx="52" cy="378" r="22" fill="#2f394a"/><text x="52" y="385" text-anchor="middle" font-weight="700" fill="#fff">4</text><text x="90" y="372" font-weight="700">Absorption to add</text><text x="90" y="398">24 − 6 ≈ 18 m²</text></g>
<g><circle cx="52" cy="472" r="22" fill="#a38703"/><text x="52" y="479" text-anchor="middle" font-weight="700" fill="#fff">5</text><text x="90" y="466" font-weight="700">Panel area on an air gap (NRC 0.85)</text><text x="90" y="492">18 ÷ 0.85 ≈ 21 m²</text></g>
</g>
<line x1="52" y1="118" x2="52" y2="168" stroke="#2f394a" stroke-width="3"/>
<line x1="52" y1="212" x2="52" y2="262" stroke="#2f394a" stroke-width="3"/>
<line x1="52" y1="306" x2="52" y2="356" stroke="#2f394a" stroke-width="3"/>
<line x1="52" y1="400" x2="52" y2="450" stroke="#2f394a" stroke-width="3"/>
<rect x="24" y="520" width="592" height="62" rx="12" fill="#a38703"/>
<text x="320" y="559" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">About 7 sheets of 1220 × 2440 mm</text>
</svg>
