<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Artificial grass cleaning calendar</title>
<desc id="d">Four rows: every week, clear leaves and spot-clean; every month, brush against the grain; after the monsoon, clear drains and edges and check for moss; around festivals, protect the lawn and wash off colour and debris.</desc>
<rect width="640" height="560" fill="#fbf8f2"/>
<text x="320" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#2f394a">A year of artificial grass care</text>
<g font-size="20" fill="#2f394a">
<rect x="24" y="70" width="592" height="104" rx="12" fill="#e6f1dc" stroke="#7cb342" stroke-width="2"/>
<rect x="24" y="70" width="168" height="104" rx="12" fill="#7cb342"/>
<text x="108" y="114" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Every</text>
<text x="108" y="142" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">week</text>
<text x="212" y="112">Blow or rake off leaves</text>
<text x="212" y="142">Lift pet waste, spot-clean spills</text>
<rect x="24" y="190" width="592" height="104" rx="12" fill="#e3eef7" stroke="#2a7fc1" stroke-width="2"/>
<rect x="24" y="190" width="168" height="104" rx="12" fill="#2a7fc1"/>
<text x="108" y="234" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Every</text>
<text x="108" y="262" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">month</text>
<text x="212" y="232">Brush against the grain</text>
<text x="212" y="262">Rinse off dust (fortnightly if dry)</text>
<rect x="24" y="310" width="592" height="104" rx="12" fill="#efe7f6" stroke="#7b5aa6" stroke-width="2"/>
<rect x="24" y="310" width="168" height="104" rx="12" fill="#7b5aa6"/>
<text x="108" y="354" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">After the</text>
<text x="108" y="382" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">monsoon</text>
<text x="212" y="352">Clear drains, outlets and edges</text>
<text x="212" y="382">Check for weeds and moss</text>
<rect x="24" y="430" width="592" height="104" rx="12" fill="#fbecd6" stroke="#e0861a" stroke-width="2"/>
<rect x="24" y="430" width="168" height="104" rx="12" fill="#e0861a"/>
<text x="108" y="474" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Holi and</text>
<text x="108" y="502" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Diwali</text>
<text x="212" y="472">Cover before Holi, rinse colour after</text>
<text x="212" y="502">Keep diyas and fireworks off the grass</text>
</g>
</svg>
