<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Acoustic panel installation sequence</title>
<desc id="d">Five steps: plan the layout with fittings marked; set out a level line; fix battens or clips, or prepare for direct fixing; cut and fit panels and cut-outs; fit trims and bring fittings forward.</desc>
<rect width="640" height="600" fill="#fbf8f2"/>
<text x="320" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#2f394a">Five steps to a finished panel wall</text>
<g font-size="20" fill="#2f394a">
<rect x="24" y="64" width="592" height="88" rx="12" fill="#fff" stroke="#2f394a" stroke-width="2"/>
<circle cx="72" cy="108" r="26" fill="#2f394a"/><text x="72" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1</text>
<text x="116" y="100" font-weight="700">Plan the layout</text><text x="116" y="128">Elevations with switches, sockets, lights</text>
<rect x="24" y="166" width="592" height="88" rx="12" fill="#fff" stroke="#2f394a" stroke-width="2"/>
<circle cx="72" cy="210" r="26" fill="#2f394a"/><text x="72" y="218" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2</text>
<text x="116" y="202" font-weight="700">Set out a level line</text><text x="116" y="230">One reference for every row</text>
<rect x="24" y="268" width="592" height="88" rx="12" fill="#fff" stroke="#2f394a" stroke-width="2"/>
<circle cx="72" cy="312" r="26" fill="#a38703"/><text x="72" y="320" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3</text>
<text x="116" y="304" font-weight="700">Fix the support</text><text x="116" y="332">Battens or clips for an air gap</text>
<rect x="24" y="370" width="592" height="88" rx="12" fill="#fff" stroke="#2f394a" stroke-width="2"/>
<circle cx="72" cy="414" r="26" fill="#2f394a"/><text x="72" y="422" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">4</text>
<text x="116" y="406" font-weight="700">Cut and fit the panels</text><text x="116" y="434">Work outwards from the line</text>
<rect x="24" y="472" width="592" height="88" rx="12" fill="#fff" stroke="#2f394a" stroke-width="2"/>
<circle cx="72" cy="516" r="26" fill="#2f394a"/><text x="72" y="524" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">5</text>
<text x="116" y="508" font-weight="700">Finish</text><text x="116" y="536">Trims; bring fittings to the new face</text>
</g>
<text x="320" y="588" text-anchor="middle" font-size="18" fill="#5a6372">Step 3 decides how much sound the wall absorbs</text>
</svg>
