<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Artificial grass installation layers</title>
<desc id="d">On soil, from the bottom up: natural soil, compacted crushed-stone base, fine levelling layer, weed membrane, artificial grass. On concrete or tiles: the existing slab sloping to a drain, an optional shock pad, artificial grass.</desc>
<defs>
<pattern id="grass" width="10" height="24" patternUnits="userSpaceOnUse"><rect width="10" height="24" fill="#fbf8f2"/><path d="M2 24 L4 2 M6 24 L8 6" stroke="#4f9a2f" stroke-width="2.4"/></pattern>
<pattern id="stone" width="22" height="18" patternUnits="userSpaceOnUse"><rect width="22" height="18" fill="#b9b2a5"/><circle cx="5" cy="5" r="3.5" fill="#8f877a"/><circle cx="15" cy="12" r="4" fill="#9d968a"/></pattern>
<pattern id="soil" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#8a6a4a"/><circle cx="4" cy="6" r="1.6" fill="#6e5238"/><circle cx="12" cy="12" r="1.6" fill="#6e5238"/></pattern>
</defs>
<rect width="640" height="520" fill="#fbf8f2"/>
<text x="320" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#2f394a">What goes under artificial grass</text>
<text x="160" y="84" text-anchor="middle" font-size="22" font-weight="700" fill="#2f394a">On soil</text>
<text x="480" y="84" text-anchor="middle" font-size="22" font-weight="700" fill="#2f394a">On concrete or tiles</text>
<line x1="320" y1="64" x2="320" y2="470" stroke="#d8d2c4" stroke-width="2"/>
<g>
<rect x="40" y="104" width="240" height="34" fill="url(#grass)"/>
<rect x="40" y="138" width="240" height="16" fill="#3d3d3d"/>
<rect x="40" y="154" width="240" height="30" fill="#d9c9a3"/>
<rect x="40" y="184" width="240" height="66" fill="url(#stone)"/>
<rect x="40" y="250" width="240" height="62" fill="url(#soil)"/>
<rect x="40" y="104" width="240" height="208" fill="none" stroke="#2f394a" stroke-width="2"/>
</g>
<circle cx="296" cy="121" r="11" fill="#2f394a"/><text x="296" y="127" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text><circle cx="296" cy="146" r="11" fill="#2f394a"/><text x="296" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text><circle cx="296" cy="169" r="11" fill="#2f394a"/><text x="296" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text><circle cx="296" cy="217" r="11" fill="#2f394a"/><text x="296" y="223" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text><circle cx="296" cy="281" r="11" fill="#2f394a"/><text x="296" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">5</text><circle cx="616" cy="165" r="11" fill="#2f394a"/><text x="616" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text><circle cx="616" cy="187" r="11" fill="#2f394a"/><text x="616" y="194" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text><circle cx="616" cy="222" r="11" fill="#2f394a"/><text x="616" y="229" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
<g font-size="20" fill="#2f394a">
<text x="40" y="350">1  Artificial grass</text>
<text x="40" y="378">2  Weed membrane</text>
<text x="40" y="406">3  Fine levelling layer</text>
<text x="40" y="434">4  Compacted stone base</text>
<text x="40" y="462">5  Natural soil</text>
</g>
<g>
<rect x="360" y="150" width="240" height="30" fill="url(#grass)"/>
<rect x="360" y="180" width="240" height="14" fill="#5b8fb0"/>
<polygon points="360,194 600,194 600,262 360,250" fill="#c7c7c2" stroke="#2f394a" stroke-width="2"/>
<rect x="360" y="150" width="240" height="44" fill="none" stroke="#2f394a" stroke-width="2"/>
<rect x="584" y="250" width="16" height="40" fill="#5b8fb0"/>
</g>
<g font-size="20" fill="#2f394a">
<text x="360" y="350">1  Artificial grass</text>
<text x="360" y="378">2  Shock pad (optional)</text>
<text x="360" y="406">3  Slab, sloped to</text>
<text x="388" y="432">the drain</text>
</g>
<text x="320" y="500" text-anchor="middle" font-size="20" fill="#5a6372">Both bases must be firm, level and free-draining</text>
</svg>
