<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Carpet tile laying sequence</title>
<desc id="d">Two chalk lines cross near the centre of a room. Tiles are laid from the crossing point outwards in a stepped pattern; cut tiles at the walls come last.</desc>
<rect width="100%" height="100%" fill="#fbf8f2"/>
<text x="320" y="40" text-anchor="middle" font-size="27" font-weight="700" fill="#2f394a">Lay from the centre outwards</text>
<rect x="40" y="70" width="560" height="400" fill="#ffffff" stroke="#2f394a" stroke-width="4"/>
<!-- cut tiles border band -->
<g fill="#ece6d8"><rect x="42" y="72" width="556" height="26"/><rect x="42" y="442" width="556" height="26"/><rect x="42" y="72" width="26" height="396"/><rect x="572" y="72" width="26" height="396"/></g>
<!-- tile grid 56px -->
<g stroke="#c9c2b3" stroke-width="1">
<line x1="68" y1="98" x2="572" y2="98"/><line x1="68" y1="154" x2="572" y2="154"/><line x1="68" y1="210" x2="572" y2="210"/><line x1="68" y1="266" x2="572" y2="266"/><line x1="68" y1="322" x2="572" y2="322"/><line x1="68" y1="378" x2="572" y2="378"/><line x1="68" y1="434" x2="572" y2="434"/><line x1="68" y1="442" x2="572" y2="442"/>
<line x1="68" y1="98" x2="68" y2="442"/><line x1="124" y1="98" x2="124" y2="442"/><line x1="180" y1="98" x2="180" y2="442"/><line x1="236" y1="98" x2="236" y2="442"/><line x1="292" y1="98" x2="292" y2="442"/><line x1="348" y1="98" x2="348" y2="442"/><line x1="404" y1="98" x2="404" y2="442"/><line x1="460" y1="98" x2="460" y2="442"/><line x1="516" y1="98" x2="516" y2="442"/><line x1="572" y1="98" x2="572" y2="442"/>
</g>
<!-- laid tiles stepped pyramid in top-right quadrant from crossing (292,266)-->
<g fill="#4f7a6a" stroke="#fff" stroke-width="2">
<rect x="292" y="210" width="56" height="56"/>
<rect x="348" y="210" width="56" height="56" opacity=".85"/><rect x="292" y="154" width="56" height="56" opacity=".85"/>
<rect x="404" y="210" width="56" height="56" opacity=".7"/><rect x="348" y="154" width="56" height="56" opacity=".7"/><rect x="292" y="98" width="56" height="56" opacity=".7"/>
<rect x="460" y="210" width="56" height="56" opacity=".55"/><rect x="404" y="154" width="56" height="56" opacity=".55"/><rect x="348" y="98" width="56" height="56" opacity=".55"/>
</g>
<g font-size="22" font-weight="700" fill="#fff" text-anchor="middle"><text x="320" y="246">1</text><text x="376" y="246">2</text><text x="320" y="190">2</text><text x="432" y="246">3</text><text x="376" y="190">3</text><text x="320" y="134">3</text></g>
<!-- chalk lines -->
<line x1="292" y1="72" x2="292" y2="468" stroke="#a0603d" stroke-width="3" stroke-dasharray="10 6"/>
<line x1="42" y1="266" x2="598" y2="266" stroke="#a0603d" stroke-width="3" stroke-dasharray="10 6"/>
<circle cx="292" cy="266" r="8" fill="#a0603d"/>
<text x="250" y="300" text-anchor="end" font-size="20" font-weight="700" fill="#a0603d">Start here</text>
<line x1="254" y1="294" x2="284" y2="273" stroke="#a0603d" stroke-width="2"/>
<!-- legend -->
<rect x="40" y="490" width="22" height="22" fill="#4f7a6a"/><text x="70" y="508" font-size="20" fill="#2f394a">Full tiles, laid in order</text>
<rect x="330" y="490" width="22" height="22" fill="#ece6d8" stroke="#2f394a"/><text x="360" y="508" font-size="20" fill="#2f394a">Cut tiles, laid last</text>
<line x1="40" y1="540" x2="90" y2="540" stroke="#a0603d" stroke-width="3" stroke-dasharray="10 6"/><text x="100" y="547" font-size="20" fill="#2f394a">Chalk lines, checked square with 3-4-5</text>
</svg>
