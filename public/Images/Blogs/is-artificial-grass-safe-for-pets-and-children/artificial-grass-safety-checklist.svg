<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 680" width="640" height="680" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Safer grass for kids and pets</title>
<desc id="d">Safety checklist for artificial grass with children and pets.</desc>
<rect width="640" height="680" fill="#fbf8f2"/>
<text x="320" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#2f394a">Safer grass for kids and pets</text>
<rect x="24" y="66" width="592" height="88" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<circle cx="72" cy="110.0" r="25" fill="#a38703"/><text x="72" y="119.0" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text>
<text x="114" y="104.0" font-size="23" font-weight="700" fill="#2f394a">Shade the play area</text>
<text x="114" y="134.0" font-size="20" fill="#4a5568">Pergola, sail or trees</text>
<rect x="24" y="166" width="592" height="88" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<circle cx="72" cy="210.0" r="25" fill="#a38703"/><text x="72" y="219.0" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">2</text>
<text x="114" y="204.0" font-size="23" font-weight="700" fill="#2f394a">Check heat before play</text>
<text x="114" y="234.0" font-size="20" fill="#4a5568">Touch the surface on hot days</text>
<rect x="24" y="266" width="592" height="88" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<circle cx="72" cy="310.0" r="25" fill="#a38703"/><text x="72" y="319.0" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">3</text>
<text x="114" y="304.0" font-size="23" font-weight="700" fill="#2f394a">Use a free-draining base</text>
<text x="114" y="334.0" font-size="20" fill="#4a5568">So urine and rain pass through</text>
<rect x="24" y="366" width="592" height="88" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<circle cx="72" cy="410.0" r="25" fill="#a38703"/><text x="72" y="419.0" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">4</text>
<text x="114" y="404.0" font-size="23" font-weight="700" fill="#2f394a">Rinse pet areas often</text>
<text x="114" y="434.0" font-size="20" fill="#4a5568">More often in hot weather</text>
<rect x="24" y="466" width="592" height="88" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<circle cx="72" cy="510.0" r="25" fill="#a38703"/><text x="72" y="519.0" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">5</text>
<text x="114" y="504.0" font-size="23" font-weight="700" fill="#2f394a">Impact protection</text>
<text x="114" y="534.0" font-size="20" fill="#4a5568">Under swings and climbing frames</text>
<rect x="24" y="566" width="592" height="88" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<circle cx="72" cy="610.0" r="25" fill="#a38703"/><text x="72" y="619.0" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">6</text>
<text x="114" y="604.0" font-size="23" font-weight="700" fill="#2f394a">Fix edges and seams flat</text>
<text x="114" y="634.0" font-size="20" fill="#4a5568">Nothing to lift, chew or trip on</text>
</svg>