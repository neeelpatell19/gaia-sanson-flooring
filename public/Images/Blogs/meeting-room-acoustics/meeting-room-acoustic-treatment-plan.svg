<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="640" height="540" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Meeting room treatment plan</title>
<desc id="d">Plan of a meeting room: table in the middle, screen and camera on one short wall, glass on one long side. Panels on the screen wall, the solid wall opposite the glass and the rear wall; a ceiling cloud over the table; carpet underfoot.</desc>
<rect width="100%" height="100%" fill="#fbf8f2"/>
<text x="320" y="38" text-anchor="middle" font-size="27" font-weight="700" fill="#2f394a">A room that sounds right on calls</text>
<text x="320" y="84" text-anchor="middle" font-size="20" font-weight="700" fill="#2f394a">Solid wall facing the glass</text>
<rect x="90" y="100" width="460" height="300" fill="#e9e4da" stroke="#2f394a" stroke-width="4"/>
<line x1="90" y1="400" x2="550" y2="400" stroke="#8fb3c9" stroke-width="10"/>
<rect x="92" y="150" width="14" height="200" fill="#4f7a6a"/>
<rect x="170" y="102" width="300" height="14" fill="#4f7a6a"/>
<rect x="534" y="170" width="14" height="160" fill="#4f7a6a"/>
<rect x="112" y="210" width="10" height="80" fill="#2f394a"/>
<rect x="190" y="200" width="270" height="100" rx="40" fill="#b9946c"/>
<rect x="208" y="178" width="234" height="144" rx="20" fill="none" stroke="#3f5d7a" stroke-width="3" stroke-dasharray="10 6"/>
<g fill="#2f394a"><circle cx="230" cy="188" r="10"/><circle cx="295" cy="188" r="10"/><circle cx="360" cy="188" r="10"/><circle cx="420" cy="188" r="10"/><circle cx="230" cy="312" r="10"/><circle cx="295" cy="312" r="10"/><circle cx="360" cy="312" r="10"/><circle cx="420" cy="312" r="10"/><circle cx="480" cy="250" r="10"/></g>
<text x="325" y="257" text-anchor="middle" font-size="20" fill="#fff" font-weight="700">Table</text>
<text x="325" y="370" text-anchor="middle" font-size="20" fill="#3f5d7a" font-weight="700">Ceiling cloud over the table</text>
<text x="70" y="250" text-anchor="middle" font-size="20" font-weight="700" fill="#2f394a" transform="rotate(-90 70 250)">Screen and camera</text>
<text x="578" y="250" text-anchor="middle" font-size="20" font-weight="700" fill="#2f394a" transform="rotate(90 578 250)">Rear wall</text>
<text x="320" y="432" text-anchor="middle" font-size="20" fill="#3f6d8a" font-weight="700">Glass wall</text>
<rect x="90" y="470" width="22" height="22" fill="#4f7a6a"/><text x="120" y="488" font-size="20" fill="#2f394a">Acoustic panels</text>
<rect x="330" y="470" width="22" height="22" fill="#e9e4da" stroke="#2f394a"/><text x="360" y="488" font-size="20" fill="#2f394a">Carpet underfoot</text>
</svg>
