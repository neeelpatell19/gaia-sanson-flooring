<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 784" width="640" height="784" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">PET acoustic panel thickness and mounting</title>
<desc id="d">Four GAIA PET panel thicknesses drawn to scale with typical rooms: 9 mm for large walls and printed designs, 12 mm for offices and classrooms, 18 mm for halls and restaurants, 24 mm for home theatres and studios. Below, a panel glued flat to the wall rates NRC 0.3, while the same panel on an air gap rates NRC 0.85 to 0.9.</desc>
<rect width="640" height="784" fill="#fbf8f2"/>
<text x="320" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#2f394a">Which thickness for which room?</text>
<rect x="24" y="70" width="592" height="92" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<rect x="44" y="84" width="45" height="64" fill="#a38703" opacity="0.85"/>
<text x="176" y="110" font-size="25" font-weight="700" fill="#2f394a">9 mm</text>
<text x="176" y="140" font-size="20" fill="#4a5568">Large walls, printed designs</text>
<rect x="24" y="174" width="592" height="92" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<rect x="44" y="188" width="60" height="64" fill="#a38703" opacity="0.85"/>
<text x="176" y="214" font-size="25" font-weight="700" fill="#2f394a">12 mm</text>
<text x="176" y="244" font-size="20" fill="#4a5568">Offices, meeting rooms, classrooms</text>
<rect x="24" y="278" width="592" height="92" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<rect x="44" y="292" width="90" height="64" fill="#a38703" opacity="0.85"/>
<text x="176" y="318" font-size="25" font-weight="700" fill="#2f394a">18 mm</text>
<text x="176" y="348" font-size="20" fill="#4a5568">Halls, restaurants, busy studios</text>
<rect x="24" y="382" width="592" height="92" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<rect x="44" y="396" width="120" height="64" fill="#a38703" opacity="0.85"/>
<text x="176" y="422" font-size="25" font-weight="700" fill="#2f394a">24 mm</text>
<text x="176" y="452" font-size="20" fill="#4a5568">Home theatres, studios, auditoriums</text>
<text x="44" y="492" font-size="17" fill="#6b7280">Board edges drawn to scale</text>
<text x="320" y="528" text-anchor="middle" font-size="24" font-weight="700" fill="#2f394a">Mounting changes more than thickness</text>
<rect x="24" y="550" width="288" height="210" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<rect x="154" y="566" width="22" height="96" fill="#9aa3ae"/>
<text x="165" y="680" text-anchor="middle" font-size="16" fill="#6b7280">wall</text>
<rect x="176" y="566" width="22" height="96" fill="#a38703"/>
<text x="168" y="714" text-anchor="middle" font-size="22" font-weight="700" fill="#2f394a">Glued flat</text>
<text x="168" y="746" text-anchor="middle" font-size="24" font-weight="700" fill="#a38703">NRC 0.3</text>
<rect x="328" y="550" width="288" height="210" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<rect x="432" y="566" width="22" height="96" fill="#9aa3ae"/>
<text x="443" y="680" text-anchor="middle" font-size="16" fill="#6b7280">wall</text>
<rect x="454" y="576" width="50" height="76" fill="#eef2f6" stroke="#9aa3ae" stroke-dasharray="5 4"/>
<text x="479" y="620" text-anchor="middle" font-size="16" fill="#4a5568">air</text>
<rect x="504" y="566" width="22" height="96" fill="#a38703"/>
<text x="472" y="714" text-anchor="middle" font-size="22" font-weight="700" fill="#2f394a">On an air gap</text>
<text x="472" y="746" text-anchor="middle" font-size="24" font-weight="700" fill="#a38703">NRC 0.85–0.9</text>
</svg>