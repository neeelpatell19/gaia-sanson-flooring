<title id="t">Play area zoning plan</title>
<desc id="d">Play area in four zones: impact-absorbing surfacing in the fall zones around a climbing frame and swings, firm turf for tricycles and ball games, a soft landscape grass lawn for open play, and a shaded seating corner, with a paved path.</desc>
