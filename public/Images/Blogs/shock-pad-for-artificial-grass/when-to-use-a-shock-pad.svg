<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="640" height="580" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">When to add a shock pad</title>
<desc id="d">Where a shock pad is worth adding under artificial grass.</desc>
<rect width="640" height="580" fill="#fbf8f2"/>
<text x="320" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#2f394a">When to add a shock pad</text>
<rect x="24" y="66" width="592" height="88" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<circle cx="72" cy="110.0" r="25" fill="#a38703"/><text x="72" y="119.0" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text>
<text x="114" y="104.0" font-size="23" font-weight="700" fill="#2f394a">Football and sports pitches</text>
<text x="114" y="134.0" font-size="20" fill="#4a5568">Consistent play, less infill</text>
<rect x="24" y="166" width="592" height="88" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<circle cx="72" cy="210.0" r="25" fill="#a38703"/><text x="72" y="219.0" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">2</text>
<text x="114" y="204.0" font-size="23" font-weight="700" fill="#2f394a">Play areas with fall risks</text>
<text x="114" y="234.0" font-size="20" fill="#4a5568">Meet the critical fall height</text>
<rect x="24" y="266" width="592" height="88" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<circle cx="72" cy="310.0" r="25" fill="#a38703"/><text x="72" y="319.0" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">3</text>
<text x="114" y="304.0" font-size="23" font-weight="700" fill="#2f394a">Grass over concrete</text>
<text x="114" y="334.0" font-size="20" fill="#4a5568">Softer on terraces and slabs</text>
<rect x="24" y="366" width="592" height="88" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<circle cx="72" cy="410.0" r="25" fill="#a38703"/><text x="72" y="419.0" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">4</text>
<text x="114" y="404.0" font-size="23" font-weight="700" fill="#2f394a">Gym and training zones</text>
<text x="114" y="434.0" font-size="20" fill="#4a5568">Cushions footfall and contact</text>
<rect x="24" y="466" width="592" height="88" rx="12" fill="#fff" stroke="#d9c9a3" stroke-width="2"/>
<circle cx="72" cy="510.0" r="25" fill="#a38703"/><text x="72" y="519.0" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">5</text>
<text x="114" y="504.0" font-size="23" font-weight="700" fill="#2f394a">Garden lawn on built base</text>
<text x="114" y="534.0" font-size="20" fill="#4a5568">Often optional</text>
</svg>