<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" width="640" height="620" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Which type of artificial grass?</title>
<desc id="d">What will the surface be used for? Relaxing, a garden or a terrace lawn leads to landscape grass. Borders, walkways or display leads to curly grass. Football, rugby or a school field leads to sports grass. Tennis, badminton, a gym or skating leads to MultiTurf.</desc>
<rect width="100%" height="100%" fill="#fbf8f2"/>
<text x="320" y="42" text-anchor="middle" font-size="27" font-weight="700" fill="#2f394a">Which artificial grass?</text>
<rect x="110" y="64" width="420" height="58" rx="29" fill="#2f394a"/>
<text x="320" y="101" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">What will the surface be for?</text>
<line x1="320" y1="122" x2="320" y2="146" stroke="#2f394a" stroke-width="3"/>
<g>
<rect x="24" y="150" width="360" height="96" rx="12" fill="#fff" stroke="#2f394a" stroke-width="2"/>
<text x="42" y="188" font-size="22" fill="#2f394a">Relaxing: a garden, terrace</text><text x="42" y="218" font-size="22" fill="#2f394a">or balcony lawn</text>
<rect x="400" y="170" width="216" height="56" rx="28" fill="#4f7a6a"/><text x="508" y="206" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Landscape grass</text>
<rect x="24" y="262" width="360" height="96" rx="12" fill="#fff" stroke="#2f394a" stroke-width="2"/>
<text x="42" y="300" font-size="22" fill="#2f394a">Texture: borders, walkways</text><text x="42" y="330" font-size="22" fill="#2f394a">or a display</text>
<rect x="400" y="282" width="216" height="56" rx="28" fill="#8a7a3a"/><text x="508" y="318" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Curly grass</text>
<rect x="24" y="374" width="360" height="96" rx="12" fill="#fff" stroke="#2f394a" stroke-width="2"/>
<text x="42" y="412" font-size="22" fill="#2f394a">Field sport: football, rugby</text><text x="42" y="442" font-size="22" fill="#2f394a">or a school field</text>
<rect x="400" y="394" width="216" height="56" rx="28" fill="#3f5d7a"/><text x="508" y="430" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Sports grass</text>
<rect x="24" y="486" width="360" height="96" rx="12" fill="#fff" stroke="#2f394a" stroke-width="2"/>
<text x="42" y="524" font-size="22" fill="#2f394a">Court sport: tennis, badminton,</text><text x="42" y="554" font-size="22" fill="#2f394a">a gym or skating</text>
<rect x="400" y="506" width="216" height="56" rx="28" fill="#a0603d"/><text x="508" y="542" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">MultiTurf</text>
</g>
<g stroke="#2f394a" stroke-width="3"><line x1="384" y1="198" x2="400" y2="198"/><line x1="384" y1="310" x2="400" y2="310"/><line x1="384" y1="422" x2="400" y2="422"/><line x1="384" y1="534" x2="400" y2="534"/></g>
<text x="320" y="608" text-anchor="middle" font-size="20" fill="#7a7f87">Then choose pile height and finish for the space</text>
</svg>
