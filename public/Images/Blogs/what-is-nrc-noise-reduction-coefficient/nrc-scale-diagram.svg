<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The NRC scale</title>
<desc id="d">NRC scale from 0 to 1 with typical surfaces: glass, stone and plaster near 0; carpet and thin absorbers fixed flat around 0.2 to 0.4; dense absorbers around 0.5 to 0.7; acoustic panels on an air gap and thick absorbers around 0.8 to 1.0.</desc>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#d9d2c4"/><stop offset="1" stop-color="#4f7a6a"/></linearGradient></defs>
<rect width="100%" height="100%" fill="#fbf8f2"/>
<text x="320" y="42" text-anchor="middle" font-size="27" font-weight="700" fill="#2f394a">The NRC scale</text>
<text x="320" y="72" text-anchor="middle" font-size="20" fill="#7a7f87">Share of sound a surface absorbs</text>
<rect x="40" y="150" width="560" height="40" rx="6" fill="url(#g)" stroke="#2f394a" stroke-width="2"/>
<g font-size="21" fill="#2f394a" text-anchor="middle">
<text x="40" y="222">0</text><text x="152" y="222">0.2</text><text x="264" y="222">0.4</text><text x="376" y="222">0.6</text><text x="488" y="222">0.8</text><text x="600" y="222">1.0</text>
</g>
<g stroke="#2f394a" stroke-width="2"><line x1="152" y1="190" x2="152" y2="200"/><line x1="264" y1="190" x2="264" y2="200"/><line x1="376" y1="190" x2="376" y2="200"/><line x1="488" y1="190" x2="488" y2="200"/></g>
<g font-size="20" fill="#2f394a">
<rect x="40" y="250" width="16" height="16" fill="#d9d2c4" stroke="#2f394a"/><text x="66" y="265">0 to 0.1: glass, stone, plaster</text>
<rect x="40" y="284" width="16" height="16" fill="#b9bfa8" stroke="#2f394a"/><text x="66" y="299">0.2 to 0.4: carpet, panels fixed flat</text>
<rect x="40" y="318" width="16" height="16" fill="#86a08c" stroke="#2f394a"/><text x="66" y="333">0.5 to 0.7: dense absorbers</text>
<rect x="40" y="352" width="16" height="16" fill="#4f7a6a" stroke="#2f394a"/><text x="66" y="367">0.8 to 1.0: panels on an air gap</text>
</g>
<text x="40" y="128" font-size="20" font-weight="700" fill="#a0603d">Reflects</text>
<text x="600" y="128" text-anchor="end" font-size="20" font-weight="700" fill="#4f7a6a">Absorbs</text>
<text x="320" y="405" text-anchor="middle" font-size="18" fill="#7a7f87">Typical ranges only; check the tested figure and mounting</text>
</svg>
